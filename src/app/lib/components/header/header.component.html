<!-- TOGGLE MOBILE BUTTON ICON-->
<button
    class="sidebar-toggle-button btn menu-icon position-absolute"
    [title]="'accessibility.buttons.menu-open' | translate"
    (click)="toggleMenu()"
    [ngClass]="{ 'button-hidden': isMenuOpen() }"
>
    <i class="bi bi-list"></i>
</button>
<nav
    id="sidebar"
    [ngClass]="{ 'mobile-sidebar-open': isMenuOpen(), 'sidebar-expanded': isSidebarExpanded() }"
    class="sidebar language-icon"
>
    <!-- CLOSE MOBILE MENU BUTTON-->
    <button
        class="btn menu-icon close-mobile-menu-button"
        [title]="'accessibility.buttons.menu-close' | translate"
        (click)="toggleMenu()"
    >
        <i class="bi bi-chevron-left"></i>
    </button>
    <!-- DESKTOP EXPAND/COLLAPSE BUTTON -->
    <button
        class="btn sidebar-expand-button d-none d-lg-flex justify-content-center align-items-center position-absolute"
        [title]="isSidebarExpanded() ? 'Collapse sidebar' : 'Expand sidebar'"
        (click)="toggleSidebar()"
    >
        <i class="bi" [ngClass]="isSidebarExpanded() ? 'bi-chevron-left' : 'bi-chevron-right'"></i>
    </button>
    <div class="sidebar-content">
        <ul class="nav flex-column flex-nowrap h-100">
            <!-- NAVI -->
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['about']"
                    aria-label="Go to About Me Section"
                >
                    <i class="bi bi-person-circle"></i>
                    <span class="nav-label ms-2">{{ 'about.menu-item' | translate }}</span>
                </a>
            </li>
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['skills']"
                    aria-label="Go to Skills Section"
                >
                    <i class="bi bi-person-fill-gear"></i>
                    <span class="nav-label ms-2">{{ 'skills.menu-item' | translate }}</span>
                </a>
            </li>
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['experience']"
                    aria-label="Go to Experience Section"
                >
                    <i class="bi bi-lightbulb-fill"></i>
                    <span class="nav-label ms-2">{{ 'experience.menu-item' | translate }}</span>
                </a>
            </li>
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['education']"
                    aria-label="Go to Education Section"
                >
                    <i class="bi bi-mortarboard-fill"></i>
                    <span class="nav-label ms-2">{{ 'education.menu-item' | translate }}</span>
                </a>
            </li>
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['linkedin']"
                    aria-label="Go to LinkedIn Posts"
                >
                    <i class="bi bi-linkedin"></i>
                    <span class="nav-label ms-2">{{ 'linkedin.menu-item' | translate }}</span>
                </a>
            </li>
            <li [routerLinkActive]="['active']" class="nav-item">
                <a
                    class="nav-link d-flex align-items-center"
                    (click)="toggleMenu()"
                    [routerLink]="['contact']"
                    aria-label="Go to Contact"
                >
                    <i class="bi bi-send-fill"></i>
                    <span class="nav-label ms-2">{{ 'contact.menu-item' | translate }}</span>
                </a>
            </li>
            <li class="bottom-area mt-auto">
                <div>
                    <app-profile></app-profile>
                </div>
            </li>
        </ul>
    </div>
</nav>
