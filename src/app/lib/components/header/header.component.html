<a class="skip-link" href="#main-content">{{ 'home.skip' | translate }}</a>
<header class="site-header">
    <div class="nav-shell">
        <a class="wordmark" routerLink="/" fragment="about" (click)="closeMenu()">
            Črt Harej
            <span>.</span>
        </a>
        <button
            class="menu-toggle"
            type="button"
            [attr.aria-expanded]="menuOpen()"
            aria-controls="main-nav"
            (click)="menuOpen.set(!menuOpen())"
        >
            {{ (menuOpen() ? 'home.close' : 'home.menu') | translate }}
        </button>
        <nav id="main-nav" [class.is-open]="menuOpen()" [attr.aria-label]="'home.navigation' | translate">
            @for (section of sections; track section) {
                <a
                    routerLink="/"
                    [fragment]="section"
                    [class.active]="activeSection() === section"
                    [attr.aria-current]="activeSection() === section ? 'location' : null"
                    (click)="closeMenu()"
                >
                    {{ 'home.nav.' + section | translate }}
                </a>
            }
        </nav>
        <div class="preferences">
            <select
                name="language"
                [value]="language.selectedLanguage()"
                (change)="changeLanguage($event)"
                [attr.aria-label]="'home.language' | translate"
            >
                <option value="en">EN</option>
                <option value="de">DE</option>
                <option value="si">SL</option>
            </select>
            <button
                type="button"
                class="theme-toggle"
                (click)="toggleTheme()"
                [attr.aria-label]="(theme.selectedTheme() === 'dark' ? 'theme.light' : 'theme.dark') | translate"
            >
                <i [class]="theme.selectedTheme() === 'dark' ? 'bi bi-sun' : 'bi bi-moon'" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</header>
