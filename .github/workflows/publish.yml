name: CI

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v1
              with:
                  node-version: "24.19"

            - name: npm install, build and test
              run: |
                  npm install
                  npm run deploy

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Deploy to S3
              run: |
                  aws s3 sync dist/website/browser/ s3://${{ vars.S3_BUCKET_NAME }} \
                    --exclude "uploads/*" \
                    --delete

            - name: Invalidate CloudFront
              run: |
                  echo "INVALIDATE CloudFront ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} /admin/index.html /admin/assets/i18n/manifest.json"
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/index.html" "/assets/i18n/manifest.json"
