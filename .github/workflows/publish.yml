name: Deploy Website

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read

jobs:
    build-and-deploy:
        name: Build site, upload to S3 and invalidate CloudFront
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v5

            - name: Validate contact form configuration
              env:
                  API_URL: ${{ vars.API_URL }}
                  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
              run: |
                  if [ -z "$API_URL" ] || [ -z "$TURNSTILE_SITE_KEY" ]; then
                    echo "::error::Set API_URL and TURNSTILE_SITE_KEY in the production environment."
                    exit 1
                  fi
                  case "$API_URL" in
                    https://*) ;;
                    *) echo "::error::API_URL must be an HTTPS URL"; exit 1 ;;
                  esac

            - name: Set production environment
              env:
                  API_URL: ${{ vars.API_URL }}
                  TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
              run: |
                  sed -i \
                    -e "s|apiUrl: ''|apiUrl: '${API_URL}'|" \
                    -e "s|turnstileSiteKey: ''|turnstileSiteKey: '${TURNSTILE_SITE_KEY}'|" \
                    src/environments/environment.prod.ts

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 26
                  cache: npm

            - name: npm install, build and test
              run: |
                  npm install
                  npm run deploy

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_OIDC_ROLE_NAME }}
                  aws-region: ${{ vars.AWS_DEFAULT_REGION }}

            - name: Deploy to S3
              run: |
                  aws s3 sync dist/website/browser/ s3://${{ vars.S3_BUCKET }} \
                    --exclude "uploads/*" \
                    --delete

            - name: Invalidate CloudFront
              run: |
                  echo "INVALIDATE CloudFront ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} /index.html /assets/i18n/manifest.json"
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/" "/index.html" "/assets/i18n/manifest.json"
